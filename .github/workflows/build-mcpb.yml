name: Build CLI release artifacts

# Builds cross-platform release artifacts for printed CLIs and publishes them
# under a moving `<slug>-current` tag. Each release contains:
#   - .mcpb bundles for Claude Desktop (3 platforms: darwin/arm64, windows/amd64, windows/arm64)
#   - raw CLI binaries for terminal users (6 platforms: standard Go matrix)
#
# The README in each CLI links to releases/download/<slug>-current/<asset>,
# so each push to main rebuilds and the URLs stay stable forever.
#
# Triggers:
#   - workflow_dispatch (manual): rebuild a specific CLI
#   - push to main on library/** (excluding build/): rebuild affected CLIs
#
# Auth: requires GENERATOR_READ_TOKEN (fine-grained PAT with Contents:read on
# mvanhorn/cli-printing-press) so the bundle job can `go install` the
# cli-printing-press generator from a private repo. The build-cli job doesn't
# need it — printed CLIs only depend on public Go modules.

on:
  workflow_dispatch:
    inputs:
      cli:
        description: 'CLI to rebuild as <category>/<slug>'
        required: true
      artifact_scope:
        description: 'Artifact set to publish'
        required: true
        default: full
        type: choice
        options:
          - full
          - cli-only
  push:
    branches: [main]
    paths:
      # Inputs that actually affect the compiled CLI binary or MCPB
      # bundle: Go source, module files, and the MCPB manifest. The
      # //go:embed directive can include any file type, but in practice
      # those files live inside cmd/ or internal/ (e.g. dub's
      # internal/mcp/embedded_manifest.json), so this whitelist still
      # catches them.
      #
      # Anything else under library/<cat>/<slug>/ — README.md, SKILL.md,
      # LICENSE, NOTICE, Makefile, .golangci.yml, .goreleaser.yaml,
      # .printing-press.json, spec.{yaml,json}, dogfood-results.json,
      # workflow-verify-report.json, .manuscripts/** — is documentation,
      # provenance, archived input, or post-build artifact and does not
      # belong in the rebuild trigger.
      - 'library/**/cmd/**'
      - 'library/**/internal/**'
      - 'library/**/go.mod'
      - 'library/**/go.sum'
      - 'library/**/manifest.json'
      - '.github/workflows/build-mcpb.yml'

permissions:
  contents: write  # for creating/updating releases
  checks: read
  issues: read
  pull-requests: read
  statuses: read

jobs:
  detect:
    name: Detect affected CLIs
    runs-on: ubuntu-latest
    outputs:
      affected: ${{ steps.detect.outputs.affected }}
      count: ${{ steps.detect.outputs.count }}
      artifact_scope: ${{ steps.detect.outputs.artifact_scope }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # need history to diff against parent commit
      - id: detect
        name: Determine affected CLIs
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_CLI: ${{ inputs.cli }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ -z "$INPUT_CLI" ]; then
              echo "::error::No CLI target provided. Specify a target with cli=<category>/<slug>, for example cli=media-and-entertainment/substack."
              exit 1
            fi
            if [ "$INPUT_CLI" = "all" ]; then
              total=$(find library -mindepth 2 -maxdepth 2 -type d | wc -l | tr -d ' ')
              echo "::error::Manual all-CLI rebuilds would expand to ${total} targets and exceed GitHub Actions' 256-combination matrix limit. Re-run with a specific CLI, for example cli=media-and-entertainment/substack."
              exit 1
            fi
            if [ ! -d "library/$INPUT_CLI" ]; then
              echo "::error::Unknown CLI target '${INPUT_CLI}'. Expected a path like media-and-entertainment/substack under library/."
              exit 1
            fi
            affected=$(printf '%s' "$INPUT_CLI" | jq -R . | jq -s -c .)
          else
            # Push event: diff against parent commit. The all-zeros sentinel
            # appears for initial branch pushes; fall back to HEAD^ then to
            # listing all library entries so the workflow degrades gracefully.
            #
            # Pathspec is restricted to build-relevant files (Go source under
            # cmd/ and internal/, module files, MCPB manifest). This mirrors
            # the on.push.paths filter above so a mixed commit that touches
            # build-relevant files in CLI A and only docs in CLI B rebuilds
            # A only. Without this filter, the awk extraction would include
            # B as affected because any path under library/<cat>/<slug>/
            # surfaces the same <cat>/<slug>.
            build_paths=(
              'library/**/cmd/**'
              'library/**/internal/**'
              'library/**/go.mod'
              'library/**/go.sum'
              'library/**/manifest.json'
            )
            if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ] || [ -z "$BEFORE_SHA" ]; then
              changed_paths=$(git diff --name-only "HEAD^" "HEAD" -- "${build_paths[@]}" 2>/dev/null || git ls-files "${build_paths[@]}")
            else
              changed_paths=$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" -- "${build_paths[@]}" || true)
            fi
            # Filter to directories that still exist in the merged tree so a
            # rename (which surfaces in `git diff` as deletions under the old
            # slug + additions under the new slug) doesn't spawn a spurious
            # matrix branch for the now-deleted directory. Without this, the
            # bundle/build/release jobs run vacuously or fail noisily for the
            # old slug. See issue #250 for the flightgoat -> flight-goat case.
            affected=$(printf '%s\n' "$changed_paths" \
              | awk -F/ 'NF >= 3 && $1 == "library" { print $2"/"$3 }' \
              | sort -u \
              | while IFS= read -r entry; do
                  [ -d "library/$entry" ] && printf '%s\n' "$entry"
                done \
              | jq -R . | jq -s -c .)
          fi
          # Filter out empty/null entries
          affected=$(printf '%s' "$affected" | jq -c '[ .[] | select(. != null and . != "") ]')
          count=$(printf '%s' "$affected" | jq 'length')
          echo "affected=$affected" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "artifact_scope=${{ inputs.artifact_scope }}" >> "$GITHUB_OUTPUT"
          else
            echo "artifact_scope=full" >> "$GITHUB_OUTPUT"
          fi
          echo "Affected CLIs ($count): $affected"

  verify-scanners:
    name: Verify release scanners for ${{ matrix.target }}
    needs: detect
    if: needs.detect.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.detect.outputs.affected) }}
    steps:
      - uses: actions/checkout@v6
      - id: source
        name: Resolve exact source PR and scanner snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          CLI_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          release_file="library/${CLI_TARGET}/.printing-press-release.json"
          source_commit=$(jq -er '.source_commit' "$release_file")
          release_version=$(jq -er '.version' "$release_file")
          pr_number=$(jq -er '.changes[-1].pr' "$release_file")
          pr_json=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}")
          merge_commit=$(jq -r '.merge_commit_sha // ""' <<<"$pr_json")
          head_sha=$(jq -r '.head.sha // ""' <<<"$pr_json")
          if [ "$merge_commit" != "$source_commit" ]; then
            echo "::error::Release ledger source ${source_commit} does not equal PR #${pr_number} merge commit ${merge_commit:-<absent>}"
            exit 1
          fi
          if [ -z "$head_sha" ]; then
            echo "::error::PR #${pr_number} has no head SHA"
            exit 1
          fi
          check_runs=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${head_sha}/check-runs?per_page=100")
          statuses=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${head_sha}/statuses?per_page=100")
          comments=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${pr_number}/comments?per_page=100" --slurp)
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --argjson pull_request "$pr_number" \
            --arg source_commit "$source_commit" \
            --arg generated_commit "$GITHUB_SHA" \
            --arg release_version "$release_version" \
            --arg head_sha "$head_sha" \
            --argjson check_runs "$(jq '.check_runs' <<<"$check_runs")" \
            --argjson statuses "$statuses" \
            --argjson comments "$(jq 'add' <<<"$comments")" \
            '{repository:$repository,pull_request:$pull_request,source_commit:$source_commit,generated_commit:$generated_commit,release_version:$release_version,head_sha:$head_sha,check_runs:$check_runs,statuses:$statuses,comments:$comments}' \
            > "${RUNNER_TEMP}/scanner-snapshot.json"
          {
            echo "head_sha=$head_sha"
            echo "pr_number=$pr_number"
            echo "slug=$(basename "${CLI_TARGET}")"
          } >> "$GITHUB_OUTPUT"
      - name: Enforce fail-closed scanner contract
        env:
          HEAD_SHA: ${{ steps.source.outputs.head_sha }}
        run: |
          python3 .github/scripts/verify-release-scanners/verify_release_scanners.py \
            --config .github/release-scanner-contract.json \
            --snapshot "${RUNNER_TEMP}/scanner-snapshot.json" \
            --expected-head "$HEAD_SHA" \
            --output "${RUNNER_TEMP}/release-scanner-receipt.json"
      - name: Upload scanner receipt
        uses: actions/upload-artifact@v6
        with:
          name: scanner-receipt-${{ steps.source.outputs.slug }}
          path: ${{ runner.temp }}/release-scanner-receipt.json
          if-no-files-found: error
          retention-days: 90

  bundle:
    name: Bundle ${{ matrix.target }} (${{ matrix.platform }})
    needs: [detect, verify-scanners]
    if: needs.detect.outputs.count != '0' && needs.verify-scanners.result == 'success' && needs.detect.outputs.artifact_scope == 'full'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.detect.outputs.affected) }}
        platform:
          # Scoped to platforms Claude Desktop actually runs on. Intel Macs
          # dropped because Apple Silicon dominates the install base; Linux
          # dropped because Claude Desktop doesn't ship there at all (Linux
          # Claude Code users have the focused skill path instead of MCPB).
          - darwin/arm64
          - windows/amd64
          - windows/arm64
    concurrency:
      # Cancel in-flight bundles when a newer push for the same (cli, platform)
      # lands. The newer source supersedes the older, so completing the older
      # build would just produce assets we'd overwrite seconds later.
      group: bundle-${{ matrix.target }}-${{ matrix.platform }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check out scanner-verified implementation source
        env:
          CLI_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          source_commit=$(jq -er '.source_commit' "library/${CLI_TARGET}/.printing-press-release.json")
          git checkout --detach "$source_commit"
      - uses: actions/setup-go@v6
        with:
          go-version-file: .go-version
          # Public library is a monorepo with per-CLI go.mod under library/<cat>/<slug>/.
          # Point setup-go at this matrix entry's go.sum so its module cache is keyed
          # correctly. Without this, setup-go warns "Dependencies file is not found".
          cache-dependency-path: library/${{ matrix.target }}/go.sum
      - name: Configure git for private modules
        env:
          TOKEN: ${{ secrets.GENERATOR_READ_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::GENERATOR_READ_TOKEN secret is not set. The workflow needs a fine-grained PAT with Contents:read on mvanhorn/cli-printing-press."
            exit 1
          fi
          git config --global url."https://oauth2:${TOKEN}@github.com/".insteadOf "https://github.com/"
      - name: Install cli-printing-press
        env:
          GOPRIVATE: github.com/mvanhorn/*
        run: |
          go install github.com/mvanhorn/cli-printing-press/v4/cmd/cli-printing-press@latest
          cli-printing-press --version
      - name: Bundle MCPB
        env:
          CLI_TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          cli_dir="library/${CLI_TARGET}"
          os="${PLATFORM%/*}"
          arch="${PLATFORM#*/}"
          slug=$(basename "${CLI_TARGET}")
          # Set artifact-name env vars unconditionally so the upload step
          # always has valid values, even when we early-exit below.
          # actions/upload-artifact@v4 rejects / in names; slugs are unique
          # across the library (slug-keyed dirs), so slug + os-arch is a
          # safe and stable artifact name.
          echo "SLUG=${slug}" >> "$GITHUB_ENV"
          echo "PLATFORM_TAG=${os}-${arch}" >> "$GITHUB_ENV"
          if [ ! -f "${cli_dir}/manifest.json" ]; then
            echo "::warning::${cli_dir} has no manifest.json — skipping bundle (likely pre-v3.0.0; needs regen via printing-press-publish)."
            exit 0
          fi
          out="${RUNNER_TEMP}/out/${slug}-pp-mcp-${os}-${arch}.mcpb"
          mkdir -p "$(dirname "$out")"
          cli-printing-press bundle "$cli_dir" --platform "${PLATFORM}" --output "$out"
          ls -lh "$out"
      - name: Upload bundle artifact
        uses: actions/upload-artifact@v6
        with:
          name: mcpb-${{ env.SLUG }}-${{ env.PLATFORM_TAG }}
          path: ${{ runner.temp }}/out/*.mcpb
          if-no-files-found: ignore
          retention-days: 7

  build-cli:
    name: Build CLI ${{ matrix.target }} (${{ matrix.platform }})
    needs: [detect, verify-scanners]
    if: needs.detect.outputs.count != '0' && needs.verify-scanners.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.detect.outputs.affected) }}
        # Standard Go cross-compile matrix. Linux included because terminal
        # users on servers/CI want it; the MCPB matrix above is narrower
        # because Claude Desktop doesn't ship on Linux.
        platform:
          - darwin/amd64
          - darwin/arm64
          - linux/amd64
          - linux/arm64
          - windows/amd64
          - windows/arm64
    concurrency:
      group: build-cli-${{ matrix.target }}-${{ matrix.platform }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: provenance
        name: Resolve release and implementation revisions
        env:
          CLI_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          release_file="library/${CLI_TARGET}/.printing-press-release.json"
          source_commit=$(jq -er '.source_commit' "$release_file")
          release_version=$(jq -er '.version' "$release_file")
          {
            echo "source_commit=$source_commit"
            echo "release_version=$release_version"
          } >> "$GITHUB_OUTPUT"
          git checkout --detach "$source_commit"
      - uses: actions/setup-go@v6
        with:
          go-version-file: .go-version
          cache-dependency-path: library/${{ matrix.target }}/go.sum
      - name: Build CLI binary
        env:
          CLI_TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
          RELEASE_VERSION: ${{ steps.provenance.outputs.release_version }}
        run: |
          set -euo pipefail
          cli_dir="library/${CLI_TARGET}"
          os="${PLATFORM%/*}"
          arch="${PLATFORM#*/}"
          slug=$(basename "${CLI_TARGET}")
          # cli_name is the authoritative binary name. Reading it from
          # .printing-press.json keeps this step honest when a CLI's directory
          # basename and cli_name diverge (e.g. an abbreviated slug paired
          # with a longer spec-derived binary name). Falling back to the
          # derived form preserves behavior for entries whose manifest
          # predates this field. See PR #455 / issue #688 for the jira case
          # this prevents.
          cli_name=$(jq -er '.cli_name' "${cli_dir}/.printing-press.json" 2>/dev/null || printf '%s-pp-cli' "${slug}")
          echo "SLUG=${slug}" >> "$GITHUB_ENV"
          echo "PLATFORM_TAG=${os}-${arch}" >> "$GITHUB_ENV"
          ext=""
          if [ "$os" = "windows" ]; then
            ext=".exe"
          fi
          out="${RUNNER_TEMP}/out/${slug}-pp-cli-${os}-${arch}${ext}"
          mkdir -p "$(dirname "$out")"
          cd "$cli_dir"
          module_path=$(awk '/^module / {print $2; exit}' go.mod)
          version_symbol="${module_path}/internal/cli.version"
          # CGO_ENABLED=0 — printed CLIs use the pure-Go modernc/sqlite driver
          # so cross-compile works without C toolchains. Matches the goreleaser
          # config the CLI ships with.
          GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 \
            go build -trimpath -ldflags="-s -w -X ${version_symbol}=${RELEASE_VERSION}" \
            -o "$out" "./cmd/${cli_name}"
          ls -lh "$out"
      - name: Upload CLI artifact
        uses: actions/upload-artifact@v6
        with:
          name: cli-${{ env.SLUG }}-${{ env.PLATFORM_TAG }}
          path: ${{ runner.temp }}/out/*
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Release ${{ matrix.target }}
    needs: [detect, verify-scanners, bundle, build-cli]
    # !cancelled() so a single CLI's bundle/build failure doesn't cascade-skip
    # release for every other successful CLI in the same matrix run. Each
    # release matrix entry is per-app (keyed on matrix.target) and downloads
    # only its own slug's artifacts, so apps don't share fate. Per-app
    # success is then enforced by the strict gate inside the release script.
    if: ${{ always() && needs.detect.outputs.count != '0' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.detect.outputs.affected) }}
    concurrency:
      # Cancel in-flight releases for the same CLI when a newer push lands.
      # gh release upload --clobber is per-asset, so a canceled mid-upload
      # is recovered by the superseding run's upload pass.
      group: release-${{ matrix.target }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
      - name: Enforce dependency conclusions
        env:
          SCANNER_RESULT: ${{ needs.verify-scanners.result }}
          BUNDLE_RESULT: ${{ needs.bundle.result }}
          CLI_RESULT: ${{ needs.build-cli.result }}
          ARTIFACT_SCOPE: ${{ needs.detect.outputs.artifact_scope }}
        run: |
          set -euo pipefail
          if [ "$SCANNER_RESULT" != "success" ]; then
            echo "::error::Release scanner result is ${SCANNER_RESULT}; success is required."
            exit 1
          fi
          if [ "$CLI_RESULT" != "success" ]; then
            echo "::error::CLI build result is ${CLI_RESULT}; success is required."
            exit 1
          fi
          if [ "$ARTIFACT_SCOPE" = "full" ] && [ "$BUNDLE_RESULT" != "success" ]; then
            echo "::error::Full release requires successful MCPB bundles; result is ${BUNDLE_RESULT}."
            exit 1
          fi
          if [ "$ARTIFACT_SCOPE" = "cli-only" ] && [ "$BUNDLE_RESULT" != "skipped" ]; then
            echo "::error::CLI-only release expected the bundle job to be skipped; result is ${BUNDLE_RESULT}."
            exit 1
          fi
      - name: Compute slug
        id: slug
        env:
          CLI_TARGET: ${{ matrix.target }}
        run: |
          slug=$(basename "${CLI_TARGET}")
          echo "slug=${slug}" >> "$GITHUB_OUTPUT"
      - name: Download MCPB artifacts for this CLI
        if: needs.detect.outputs.artifact_scope == 'full'
        uses: actions/download-artifact@v7
        with:
          path: ${{ runner.temp }}/dl
          pattern: mcpb-${{ steps.slug.outputs.slug }}-*
          merge-multiple: true
      - name: Download CLI binary artifacts for this CLI
        uses: actions/download-artifact@v7
        with:
          path: ${{ runner.temp }}/dl
          pattern: cli-${{ steps.slug.outputs.slug }}-*
          merge-multiple: true
      - name: Download exact-head scanner receipt
        uses: actions/download-artifact@v7
        with:
          path: ${{ runner.temp }}/receipt
          name: scanner-receipt-${{ steps.slug.outputs.slug }}
      - name: List downloaded artifacts and enforce per-app gate
        env:
          CLI_TARGET: ${{ matrix.target }}
          SLUG: ${{ steps.slug.outputs.slug }}
          ARTIFACT_SCOPE: ${{ needs.detect.outputs.artifact_scope }}
        run: |
          set -euo pipefail
          ls -lh "${RUNNER_TEMP}/dl" || true
          mcpb_count=$(find "${RUNNER_TEMP}/dl" -name '*.mcpb' 2>/dev/null | wc -l | tr -d ' ')
          # CLI binaries have no consistent extension — count what's left after excluding .mcpb.
          all_count=$(find "${RUNNER_TEMP}/dl" -type f 2>/dev/null | wc -l | tr -d ' ')
          cli_count=$((all_count - mcpb_count))
          echo "Found ${mcpb_count} .mcpb file(s) and ${cli_count} CLI binary file(s)."
          if [ "$cli_count" -ne 6 ]; then
            echo "::error::Release for ${SLUG} requires exactly 6 CLI binaries; found ${cli_count}."
            exit 1
          fi
          expected_mcpb=0
          if [ "$ARTIFACT_SCOPE" = "full" ] && [ -f "library/${CLI_TARGET}/manifest.json" ]; then
            expected_mcpb=3
          fi
          if [ "$mcpb_count" -ne "$expected_mcpb" ]; then
            echo "::error::Release for ${SLUG} requires exactly ${expected_mcpb} MCPB bundles for scope ${ARTIFACT_SCOPE}; found ${mcpb_count}."
            exit 1
          fi
          cp "${RUNNER_TEMP}/receipt/release-scanner-receipt.json" "${RUNNER_TEMP}/dl/${SLUG}-release-scanner-receipt.json"
          (cd "${RUNNER_TEMP}/dl" && sha256sum -- ./* > SHA256SUMS)
      - name: Verify release-write PAT
        env:
          GH_TOKEN: ${{ secrets.RELEASE_WRITE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          if ! gh api "/repos/${GITHUB_REPOSITORY}" --jq '.full_name' >/dev/null 2>&1; then
            echo "::error::Release token does not have access to ${GITHUB_REPOSITORY}."
            exit 1
          fi
          echo "Release token confirmed for repo ${GITHUB_REPOSITORY}."
      - name: Publish release ${{ steps.slug.outputs.slug }}-current
        env:
          # Prefer the dedicated fine-grained PAT when configured. Owned
          # forks can use the workflow token's contents:write grant.
          GH_TOKEN: ${{ secrets.RELEASE_WRITE_TOKEN || github.token }}
          SLUG: ${{ steps.slug.outputs.slug }}
          CLI_TARGET: ${{ matrix.target }}
          ARTIFACT_SCOPE: ${{ needs.detect.outputs.artifact_scope }}
        run: |
          set -euo pipefail
          tag="${SLUG}-current"
          # Skip if neither bundle nor CLI artifacts were produced.
          if ! find "${RUNNER_TEMP}/dl" -type f -print -quit | grep -q .; then
            echo "No artifacts to publish for ${SLUG}; skipping release."
            exit 0
          fi
          # shellcheck disable=SC2016
          notes=$(printf 'Auto-built **%s** artifacts for **%s** at commit %s.\n\nThe attached scanner receipt is bound to the exact implementation PR head. `SHA256SUMS` covers every published artifact and the receipt.\n\n**Terminal CLI:** download the binary matching your platform. On macOS you may need to clear the Gatekeeper quarantine: `xattr -d com.apple.quarantine <binary>`. On Unix, `chmod +x <binary>`.\n\n_This is a moving tag; it always points at the latest compliant build._' "${ARTIFACT_SCOPE}" "${CLI_TARGET}" "${GITHUB_SHA}")
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "Updating existing release ${tag}"
            while IFS= read -r existing_asset; do
              if [ ! -e "${RUNNER_TEMP}/dl/${existing_asset}" ]; then
                echo "Deleting stale release asset ${existing_asset}"
                gh release delete-asset "${tag}" "${existing_asset}" --yes
              fi
            done < <(gh release view "${tag}" --json assets --jq '.assets[].name')
            gh release upload "${tag}" "${RUNNER_TEMP}"/dl/* --clobber
            gh release edit "${tag}" --notes "${notes}" --target "${GITHUB_SHA}"
          else
            echo "Creating new release ${tag}"
            gh release create "${tag}" "${RUNNER_TEMP}"/dl/* \
              --title "${SLUG} (latest build)" \
              --notes "${notes}" \
              --target "${GITHUB_SHA}" \
              --latest=false
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}" \
              -f sha="${GITHUB_SHA}" -F force=true >/dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${tag}" -f sha="${GITHUB_SHA}" >/dev/null
          fi
          resolved=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq '.object.sha')
          if [ "$resolved" != "$GITHUB_SHA" ]; then
            echo "::error::Moving tag ${tag} resolved to ${resolved}, expected ${GITHUB_SHA}."
            exit 1
          fi
